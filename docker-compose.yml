version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: doc_verify_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - doc_verify_net

  web:
    image: nginx:alpine
    container_name: doc_verify_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - doc_verify_net

  db:
    image: postgres:15-alpine
    container_name: doc_verify_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: doc_verify_db
      POSTGRES_USER: doc_verify_user
      POSTGRES_PASSWORD: doc_verify_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - doc_verify_net

  redis:
    image: redis:alpine
    container_name: doc_verify_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - doc_verify_net

  queue-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: doc_verify_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: php artisan queue:work --verbose --tries=3 --timeout=300
    depends_on:
      - app
      - db
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - doc_verify_net

networks:
  doc_verify_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

